name: "Atomic App Scanner"
description: "Scan an Android APK with Atomic App Scanner and fail the build on findings above a severity threshold."
author: "Atomic Security"
branding:
  icon: "shield"
  color: "purple"

inputs:
  api-key:
    description: "Atomic API key (ask_live_...). Store it as a repository or organization secret."
    required: true
  apk-path:
    description: "Path to the APK to scan (e.g. app/build/outputs/apk/release/app-release.apk)."
    required: true
  fail-on:
    description: "Lowest severity that fails the build: info | low | medium | high | critical."
    required: false
    default: "high"
  wait-timeout:
    description: "Maximum seconds to wait for a free slot and for the scan to finish."
    required: false
    default: "1800"
  sarif-output:
    description: "Optional path to write SARIF results to (feed into github/codeql-action/upload-sarif)."
    required: false
    default: ""
  api-url:
    description: "Atomic API base URL. Leave the default unless you were given another one."
    required: false
    default: "https://atomicsecurity.app/api"

outputs:
  scan-id:
    description: "The id of the scan."
    value: ${{ steps.scan.outputs.scan-id }}
  scan-url:
    description: "The scan's report page."
    value: ${{ steps.scan.outputs.scan-url }}
  blocking-findings:
    description: "How many vulnerabilities are at or above fail-on."
    value: ${{ steps.scan.outputs.blocking-findings }}

runs:
  using: "composite"
  steps:
    - name: Run Atomic scan
      id: scan
      shell: bash
      run: python3 "${{ github.action_path }}/atomic_scan.py"
      env:
        ATOMIC_API_KEY: ${{ inputs.api-key }}
        ATOMIC_API_URL: ${{ inputs.api-url }}
        ATOMIC_APK_PATH: ${{ inputs.apk-path }}
        ATOMIC_FAIL_ON: ${{ inputs.fail-on }}
        ATOMIC_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        ATOMIC_SARIF_OUTPUT: ${{ inputs.sarif-output }}
